<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>responsive preview</title>
<style>
  html,body{margin:0;height:100%;background:#22303c;}
  body{display:flex;align-items:flex-start;justify-content:center;padding:10px;}
  .wrap{transform-origin:top center;}
  iframe{border:0;background:#fff;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.45);display:block;}
  .label{color:#9fb3c4;font:12px/1.6 system-ui,sans-serif;text-align:center;padding:4px;}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="label" id="label"></div>
  <iframe id="f"></iframe>
</div>
<script>
  const p = new URLSearchParams(location.search);
  const w = +(p.get('w') || 1024), h = +(p.get('h') || 768), s = +(p.get('s') || 1);
  const f = document.getElementById('f');
  f.style.width = w + 'px'; f.style.height = h + 'px';
  f.src = 'index.html?bust=' + Date.now();
  document.getElementById('wrap').style.transform = 'scale(' + s + ')';
  document.getElementById('label').textContent = w + ' × ' + h;
</script>
</body>
</html>
